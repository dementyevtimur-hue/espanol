<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clases de Español</title>
<style>
:root{--bg:#F3F5F7;--ink:#17202B;--muted:#5A6675;--accent:#0B6E6B;--line:#DCE2E8}
@media (prefers-color-scheme:dark){:root{--bg:#0F151B;--ink:#E5EAF0;--muted:#98A4B2;--accent:#53C4BE;--line:#28323D;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:36px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
a{display:block;padding:14px 18px;border:1px solid var(--line);border-radius:10px;color:var(--accent);text-decoration:none;font-weight:600}
a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Clases de Español</h1>
<p>Elige tu página.</p>
<ul>
<li><a href="ilya/">Ilya</a></li>
</ul>
</main>
</body>
</html>
